[project]
name = "job-hunt-os"
version = "0.1.0"
description = "Job Hunt OS - an evidence-grounded career decision-and-execution system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "reportlab>=4.2",
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[project.scripts]
jobhunt = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# This directory also holds unrelated sibling projects. Never lint or format them.
extend-exclude = ["NBA-performance-predictor", ".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length is enforced by the formatter.
# B008: FastAPI Depends()/Form() defaults are the framework's own idiom.
# UP042: enums deliberately inherit (str, Enum) rather than StrEnum so that
#        str(member) keeps the "Class.MEMBER" repr; the DB stores .value only.
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
plugins = []
exclude = ["alembic/versions/"]
