# CURATED COMPANY WATCHLIST - PUBLIC DEMO
#
# The registry is this curated seed plus `company` rows the app adds (Sources ->
# Add a company, or `python -m app.cli company add`). The seed is read, never
# written, by the app.
#
# Two flags, deliberately separate:
#
#   active                        on the watchlist and wanted in the search universe
#   automated_collection_enabled  Channel A can actually poll this ATS today
#
# The demo ships only FICTIONAL companies with collection disabled, so a fresh
# clone makes no network request until you add a real public board yourself:
#
#   python -m app.cli company add "<Company>" <public ATS board URL>
#
# Supported public endpoints: Greenhouse, Lever, Ashby, SmartRecruiters and
# Workday career sites. No login, cookie or credential is ever used.

