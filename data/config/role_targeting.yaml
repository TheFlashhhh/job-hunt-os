#: STRONG_INFERENCE (D-70). A posting that DESCRIBES a capability, in words
#: that are not the skill's own name, admits the demonstrated skill that
#: implements it - "tree-based models" admits XGBoost and Random Forest. A
#: signal matches when all its words appear in the posting. Every skill named
#: here must already be resume-usable in skills.yaml; a rule can never create
#: one, and a rule pointing at a gap (AWS, Airflow, RAG) is a defect.
skill_inference:
  - signals: [tree-based, gradient boosting, boosted trees, ensemble models]
    skills: [XGBoost, Random Forest]
  - signals: [restful, web services, backend services, microservices, api development]
    skills: [REST APIs / Postman / Swagger, Flask]
