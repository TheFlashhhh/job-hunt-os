#: Used when nothing scores above the floor. Keeps the existing behaviour rather
#: than guessing: the role family's own base, ordered as it always was.
fallback_archetype: DATA_SCIENCE

#: An archetype must reach this weighted score before it displaces the fallback.
#: Below it the posting has not said enough to position against.
minimum_archetype_score: 5

#: Role families the classifier emits → the archetype that usually fits them.
#: Used ONLY to break ties and to seed the score, never to override strong
#: posting evidence. This is what stops "Analytics Engineer, Data Science" from
#: being positioned as a modelling role purely because of the title suffix.
role_family_affinity:
  ANALYTICS_ENGINEERING: ANALYTICS_ENGINEERING
  DATA_ENGINEERING: DATA_ENGINEERING
  DATA_ANALYST: PRODUCT_ANALYTICS
  PRODUCT_ANALYTICS: PRODUCT_ANALYTICS
  DECISION_SCIENCE: PRODUCT_ANALYTICS
  TECHNICAL_PRODUCT: PRODUCT_ANALYTICS
  DATA_SCIENTIST: DATA_SCIENCE
  ML_ENGINEER: MACHINE_LEARNING_ENGINEERING
  AI_ENGINEER: MACHINE_LEARNING_ENGINEERING
  APPLIED_AI: APPLIED_AI_SOFTWARE
  AI_SOFTWARE_ENGINEER: APPLIED_AI_SOFTWARE
  SOFTWARE_ENGINEERING: SOFTWARE_ENGINEERING
#: Weight given to that affinity. Deliberately small — one strong title signal
#: (6) outweighs it, so the posting always wins over the classifier's label.
role_family_affinity_weight: 2
