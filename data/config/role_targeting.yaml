# ROLE TARGETING PROFILES
#
# A resume base answers "which family of roles is this for?". That is too coarse
# to position against a specific posting: a real "Analytics Engineer, Data
# Science" posting classifies as DATA_SCIENTIST on its title, and the DS_ML_AI base then
# led the page with CNNs, computer vision and LSTMs for a job whose actual
# subject is SQL transformation, ETL/ELT and data quality.
#
# So an ARCHETYPE is derived from the posting itself and decides POSITIONING:
# which safe claims lead, how skills are grouped, what the summary says, and
# what gets pushed down the page.
#
# ─────────────────────────────────────────────────────────────────────────────
# TARGETING IS NOT PERMISSION.
#
# Nothing in this file can put a skill or a claim onto a resume. Every skill
# named here is still looked up in skills.yaml and dropped unless the Evidence
# Bank marks it resume-usable; every bullet is still the verbatim text of a safe
# claim. A JD asking for Tableau, Looker, Sigma, AWS, Airflow or RAG changes the
# ORDER of what the candidate actually has — never the CONTENTS.
#
# This file therefore holds three kinds of thing, and only three:
#   * signals  — how to recognise an archetype in a posting (matching only)
#   * ordering — which categories and claim families lead (ranking only)
#   * frames   — authored sentence templates whose facts come from the Bank
# ─────────────────────────────────────────────────────────────────────────────

schema_version: "1"

#: How hard targeting reorders. Weights are applied to the bullet utility score.
#: No level unlocks unsupported content — CONSERVATIVE and AGGRESSIVE_SAFE draw
#: from exactly the same set of safe claims, and differ only in how sharply
#: JD alignment outranks generic claim strength.
# `bullet_quality` is the X-Y-Z preference (app/services/bullet_quality.py): does
# the line say what was achieved, or only what was touched? It is weighted well
# below requirement_match on purpose. Relevance and truthfulness decide what goes
# on the page; writing quality breaks ties between comparable bullets. A well
# written bullet about the wrong thing must never beat a plainer one about the
# right thing, and no weight here can create, reword or quantify a claim.
targeting_intensity:
  default: BALANCED
  levels:
    CONSERVATIVE:
      requirement_match: 1.0
      keyword_alignment: 0.5
      role_family_relevance: 1.0
      evidence_strength: 2.0
      metric_strength: 1.0
      ownership_confidence: 1.0
      recency: 0.5
      uniqueness: 0.5
      business_impact: 0.4
      technical_depth: 0.4
      bullet_quality: 0.8
      space_cost: 0.3
    BALANCED:
      requirement_match: 2.4
      keyword_alignment: 1.6
      role_family_relevance: 1.8
      evidence_strength: 1.2
      metric_strength: 0.9
      ownership_confidence: 0.8
      recency: 0.6
      uniqueness: 0.8
      business_impact: 0.7
      technical_depth: 0.7
      bullet_quality: 0.9
      space_cost: 0.3
    AGGRESSIVE_SAFE:
      requirement_match: 3.4
      keyword_alignment: 2.6
      role_family_relevance: 2.4
      evidence_strength: 0.8
      metric_strength: 0.7
      ownership_confidence: 0.6
      recency: 0.5
      uniqueness: 1.0
      business_impact: 0.9
      technical_depth: 0.9
      bullet_quality: 0.7
      space_cost: 0.3

# ─────────────────────────────────────────────────────────────────────────────
# USER PROJECT PREFERENCES
#
# A project in the Evidence Bank may carry `resume_selection_priority`. The
# label is the user's own preference about how often they want to SEE a project
# on a tailored resume; the multiplier below is what that preference costs.
#
# It multiplies the utility of every bullet the project owns, which flows
# through to the project's own entry value and so to which projects survive the
# entry cap. Two properties make it a preference rather than a veto:
#
#   * it is MODEST — a 0.85 default is a nudge, not an exclusion;
#   * it FADES as the posting engages the line. The multiplier applies in full
#     only where the JD shows no particular pull toward this material, and
#     reaches 1.0 where the posting names it:
#         effective = 1 - (1 - modifier) x (1 - engagement)
#     with engagement = max(requirement_match, keyword_alignment).
#
# The fade is load-bearing, not decoration. Measured against a real
# simulation/backtesting posting, a FLAT 0.85 dropped the de-prioritised
# project from the page even though it was the best match on the board — the
# JD-relevance dimensions move in tenths of a point, so a flat 15% penalty is
# larger than the gap relevance can open. Faded, the same posting selects it
# first. "Less often, not never" is only true if strong relevance can actually
# cancel the preference out.
#
# What it is NOT: a way to remove a project. A LOWER project keeps every claim,
# metric and evidence item it had, stays resume_ready, stays in the candidate
# pools, and still leads the page when the posting calls for it. Anything that
# should never be selected belongs behind `resume_auto_select: false` in the
# Bank, not behind a ranking multiplier here.
#
# Generic by construction: no project name appears in this file or in the
# scoring code. To change a preference, change the label on the project.
# ─────────────────────────────────────────────────────────────────────────────
selection_priority_modifiers:
  HIGHER: 1.15
  NORMAL: 1.0
  LOWER: 0.85

#: Wording that marks business/stakeholder value in a claim. Used to score
#: business_impact — matched against the CLAIM text, never added to it.
business_impact_terms:
  - client
  - stakeholder
  - recommendation
  - decision
  - presented
  - findings
  - business
  - product
  - policy
  - reusable
  - self-serve
  - adoption
  - retention

#: Wording that marks depth of engineering in a claim. Scores technical_depth.
technical_depth_terms:
  - pipeline
  - schema
  - validation
  - ingestion
  - transformation
  - etl
  - elt
  - streaming
  - kafka
  - spark
  - pyspark
  - sql
  - database
  - kubernetes
  - docker
  - api
  - scheduling
  - monitoring
  - normalisation
  - normalization

# ═════════════════════════════════════════════════════════════════════════════
# ARCHETYPES, most specific first. The first archetype whose score clears its
# own threshold and beats every other wins; ties break on list order.
# ═════════════════════════════════════════════════════════════════════════════
archetypes:
  # ───────────────────────────────────────────────────────────────────────
  - name: ANALYTICS_ENGINEERING
    #: Which graduate courses lead the Relevant Coursework line for this
    #: archetype. ORDERING ONLY - every name is resolved against the Evidence
    #: Bank's canonical course list and dropped if it is not there.
    coursework_priority:
      - Data Engineering at Scale
      - Tools for Data Science
      - Mathematical Foundations of Data Science and Machine Learning
      - People Analytics
      - Machine Learning in Healthcare
    label: Analytics Engineering
    resume_base: DATA_ENGINEERING
    business_context: >-
      Building trusted, reusable analytics datasets and metrics that other
      teams depend on for decisions.
    experience_bar_note: "Analytics/BI/data engineering experience, usually 2+ years."
    title_signals:
      analytics engineer: 6
      analytics engineering: 6
      bi engineer: 5
      business intelligence engineer: 5
      data platform: 3
      data products: 3
    jd_signals:
      etl: 2
      elt: 3
      data warehouse: 2
      data warehousing: 2
      data lake: 2
      dbt: 3
      canonical dataset: 3
      data quality: 3
      data integrity: 2
      self-serve: 2
      analytics engineering: 4
      business intelligence: 2
      data transformation: 3
      reusability: 2
      stakeholder: 1
      dimensional model: 3
    primary_competencies:
      [SQL, Python, data transformation, data quality, ETL/ELT,
       analytics data products, stakeholder requirements]
    secondary_competencies:
      [Spark, databases, dashboarding, documentation, self-serve analytics,
       schema design]
    deemphasize:
      [deep-learning model architecture, computer vision, NLP,
       neural network training]
    deemphasized_categories: [DEEP_LEARNING, COMPUTER_VISION, NLP, RESPONSIBLE_AI]
    #: Claim role_families that count as on-target, best first.
    claim_role_families:
      [ANALYTICS_ENGINEERING, DATA_ENGINEERING, DATA_ANALYST, DATA_SCIENTIST,
       TECHNICAL_PRODUCT, SWE]
    summary_template: >-
      {degree_short} candidate at {institution} with hands-on experience building
      Python/SQL data workflows, pipelines, data-quality checks and
      stakeholder-facing analytics across professional and client projects.
      Experienced in {skills}.
    summary_skills:
      ["SQL", "Python", "ETL / ELT / data pipelines", "Data quality monitoring",
       "Spark / PySpark", "Kafka", "PostgreSQL", "Data cleaning / feature engineering",
       "Client delivery / stakeholder presentation"]
    #: CORE_ROLE skills (D-70): what a strong general resume for this family
    #: lists, curated BY NAME. Not a count - and not a category: sharing a
    #: category with the role makes a skill a candidate, never a member. A
    #: candidate outside this list renders only when the posting names it or
    #: describes it (`skill_inference`). include and summary_skills count too.
    core_skills:
      - "ETL / ELT / data pipelines"
      - "Data quality monitoring"
      - "Schema validation"
      - "Spark / PySpark"
      - "Kafka"
      - "PostgreSQL"
      - "pandas / NumPy"
      - "Data cleaning / feature engineering"
      - "Product analytics / event-log analysis"
      - "Metric debugging / instrumentation design"
      - "Tableau"
      - "Docker"
      - "Git / GitHub / VS Code / Visual Studio / JIRA"
    skill_groups:
      - label: Programming & Querying
        include: [Python, SQL]
        categories: [PROGRAMMING]
        exclude_categories: [DATABASES, DATA_ANALYSIS]
      - label: Data Engineering
        categories: [DATA_ENGINEERING, STREAMING, ANALYTICS_ENGINEERING]
        # Docker and Kubernetes are CLOUD as well as DATA_ENGINEERING; they
        # belong under infrastructure on this resume so the pipeline group
        # keeps its room for transformation and data-quality items.
        exclude_categories: [CLOUD]
        prefer: [ETL / ELT / data pipelines, Spark / PySpark, Kafka,
                 Data quality monitoring, Schema validation,
                 Event-driven ingestion, Data cleaning / feature engineering]
      - label: Databases
        categories: [DATABASES, SQL]
        prefer: [PostgreSQL, TimescaleDB, SQL Server / Oracle / MySQL]
      - label: Analytics
        categories: [DATA_ANALYSIS, PRODUCT_ANALYTICS, ANALYTICS, STATISTICS,
                     VISUALIZATION, GEOSPATIAL]
        exclude_categories: [BACKEND]
        prefer: [pandas / NumPy, Product analytics / event-log analysis,
                 Metric debugging / instrumentation design,
                 Statistics / Probability / Linear Algebra, Streamlit,
                 matplotlib / seaborn / Jupyter]
      - label: Infrastructure & Collaboration
        categories: [CLOUD, DEVTOOLS, PROJECT_MANAGEMENT, API, TESTING]
        prefer: [Docker,
                 "Kubernetes / OpenShift / Tekton / CronJobs / ConfigMaps / Secrets / PVCs / RBAC",
                 Git / GitHub / VS Code / Visual Studio / JIRA, Azure DevOps,
                 Agile / sprint participation]
      - label: Machine Learning
        categories: [MACHINE_LEARNING, DEEP_LEARNING, NLP, COMPUTER_VISION]

