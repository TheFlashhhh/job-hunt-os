# Search profiles. Keywords live here, never hard-coded in connectors.
#
# ONE ACTIVE LANE since 2026-09-08 (D-51): FULL_TIME_2027. The two
# FALL_2026_INTERNSHIP_COOP profiles below are `enabled: false` rather than
# deleted — they record what was searched for and with which keywords, and that
# history is worth keeping. Nothing reads a disabled profile.

schema_version: "1"

search_profiles:
  # ─────────────────────────── LANE A — FALL 2026 ───────────────────────────
  - profile_id: fall_boston
    lane: FALL_2026_INTERNSHIP_COOP
    enabled: false
    frequency_hours: 3
    max_results: 250
    locations: ["Boston, MA", "Cambridge, MA", "Greater Boston"]
    remote: false
    employment_type: [INTERNSHIP, CO_OP, PART_TIME]
    title_keywords:
      - Data Science Intern
      - Data Scientist Intern
      - Machine Learning Intern
      - ML Engineer Intern
      - AI Intern
      - Applied AI Intern
      - AI Engineer Intern
      - Data Analyst Intern
      - Product Analyst Intern
      - Product Analytics Intern
      - Data Engineer Intern
      - Analytics Engineer Intern
    term_keywords:
      - Fall 2026 internship
      - Fall internship
      - Fall co-op
      - semester internship
      - semester co-op
      - academic-year internship
      - September-December internship
      - part-time internship
      - part-time co-op
    exclusion_keywords: [Summer 2026, Summer 2027, senior, staff, principal, director]
    source_scope: [greenhouse, lever, ashby, smartrecruiters, apify_linkedin]

  - profile_id: fall_remote
    lane: FALL_2026_INTERNSHIP_COOP
    enabled: false
    frequency_hours: 3
    max_results: 250
    locations: ["Remote (US)", "United States"]
    remote: true
    employment_type: [INTERNSHIP, CO_OP, PART_TIME]
    title_keywords:
      - Remote Data Science Intern
      - Remote Machine Learning Intern
      - Remote AI Intern
      - Remote Data Analyst Intern
      - Remote Data Engineer Intern
    term_keywords: [remote internship, remote co-op, Fall 2026 internship, semester internship]
    exclusion_keywords: [Summer 2026, senior, staff, principal]
    source_scope: [greenhouse, lever, ashby, apify_linkedin]

