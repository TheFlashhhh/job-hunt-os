<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job Hunt OS{% endblock %}</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --text:#e6e9ef; --muted:#9aa3b2; --dim:#6b7484;
  --accent:#5b9dff; --good:#3fbf7f; --warn:#e2b341; --bad:#e2685f; --info:#9b7fe0;
  --radius:10px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dfe3ea;
         --text:#151922; --muted:#5b6472; --dim:#828b99; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
nav{max-width:1500px;margin:0 auto;padding:12px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
nav .brand{font-weight:700;letter-spacing:-.02em;margin-right:8px}
nav .brand small{color:var(--dim);font-weight:400;font-size:11px;display:block;letter-spacing:0}
nav a.navlink{color:var(--muted);font-weight:500;padding:4px 0}
nav a.navlink:hover,nav a.navlink.active{color:var(--text);text-decoration:none}
main{max-width:1500px;margin:0 auto;padding:22px 20px 64px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:16px;margin:26px 0 12px;letter-spacing:-.01em}
h3{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .n{font-size:26px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:2fr 1fr}
@media(max-width:1000px){.two,.three{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
   letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
.scroll{overflow-x:auto}
.tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;
     letter-spacing:.02em;border:1px solid transparent;white-space:nowrap}
.t-good{background:rgba(63,191,127,.14);color:var(--good);border-color:rgba(63,191,127,.3)}
.t-warn{background:rgba(226,179,65,.14);color:var(--warn);border-color:rgba(226,179,65,.3)}
.t-bad{background:rgba(226,104,95,.14);color:var(--bad);border-color:rgba(226,104,95,.3)}
.t-info{background:rgba(155,127,224,.14);color:var(--info);border-color:rgba(155,127,224,.3)}
.t-dim{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:5px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:12px}
.xs{font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
input,select,textarea,button{font:inherit;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);border-radius:7px;padding:8px 10px}
textarea{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
button{background:var(--accent);color:#fff;border:none;font-weight:600;cursor:pointer;padding:9px 15px}
button:hover{filter:brightness(1.08)}
button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field{margin-bottom:12px}
.notice{border-left:3px solid var(--accent);background:var(--panel2);padding:11px 14px;
  border-radius:0 7px 7px 0;font-size:13px;margin:10px 0}
.notice.warn{border-color:var(--warn)}
.notice.bad{border-color:var(--bad)}
.notice.good{border-color:var(--good)}
.empty{color:var(--dim);font-size:13px;padding:14px 0;font-style:italic}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:7px 0;border-bottom:1px solid var(--line)}
ul.clean li:last-child{border-bottom:none}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);font-size:12px;font-weight:500}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill:hover{text-decoration:none;color:var(--text)}
.pill.on:hover{color:#fff}
</style>
</head>
<body>
<header>
  <nav>
    <span class="brand">Job Hunt OS<small>Evidence Bank v{{ bank.evidence_bank_version if bank is mapping else '0.1' }}</small></span>
    <a class="navlink" href="/">Dashboard</a>
    <a class="navlink" href="/jobs">Jobs</a>
    <a class="navlink" href="/import">Import</a>
    <a class="navlink" href="/evidence">Evidence Bank</a>
    <a class="navlink" href="/claim-check">Claim Check</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
